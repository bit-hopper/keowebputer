# Build the keo package (the folder you load unpacked in the browser) and attach it as a zip.
# A tag like v0.1.0 builds and publishes a release; a manual run only keeps the zip as a run artifact.
# The runtime's files are the snapshot in kernel/ (see extension/refresh-kernel.js), so the build needs nothing but this
# repository; the kernel commit the snapshot was taken from is written into the package (keo-build.json).
name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: |
          npm run test:did
          npm run test:release

      # A tag build is labelled with its tag (v0 -> version 0); a manual run is labelled 0.0.0.
      - name: Build the package
        env:
          KEO_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: node extension/build.js dist

      - name: Zip
        id: zip
        run: |
          name="keo-webputer-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          mv dist keo-webputer
          zip -qr "$name.zip" keo-webputer
          echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          cat keo-webputer/keo-build.json

      - uses: actions/upload-artifact@v4
        with:
          name: keo-webputer
          path: ${{ steps.zip.outputs.file }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.file }}" --title "$GITHUB_REF_NAME" --generate-notes
