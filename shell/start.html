<!doctype html>
<meta charset="utf-8">
<title>keo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui, sans-serif; color: #222; }
  #world { display: block; border: 0; width: 100%; height: 100%; }
  /* The identity vault page: hidden (1px, transparent, not clickable) until the world asks for its unlock button. */
  #vault { position: fixed; left: 0; top: 0; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
  #vault.shown { left: 50%; top: 50%; width: 320px; height: 96px; transform: translate(-50%, -50%); opacity: 1; pointer-events: auto;
                 z-index: 2147483647; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
  /* The call panel (keo-call.js). Drawn by this page, placed and sized HERE and nowhere else: nothing the world sends moves or hides it.
     Its z-index must stay BELOW the vault's: the unlock frame must never be covered by a call. */
  #keo-call { position: fixed; right: 16px; bottom: 16px; width: 300px; box-sizing: border-box; padding: 12px; z-index: 2147483000;
              background: #1d1f27; color: #f2f3f7; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
  #keo-call[hidden] { display: none; }
  #keo-call.video { width: 360px; }
  #keo-call .head { display: flex; align-items: center; gap: 10px; }
  #keo-call .who-img { width: 40px; height: 40px; border-radius: 6px; image-rendering: pixelated; flex: none; }
  #keo-call .who { min-width: 0; }
  #keo-call .who-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #keo-call .who-did { font: 12px ui-monospace, monospace; color: #a9adbd; }
  #keo-call .status { margin: 10px 0 6px; color: #d6d9e4; }
  #keo-call .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; display: none; aspect-ratio: 4 / 3; }
  #keo-call.video .stage { display: block; }
  #keo-call .remote, #keo-call .hold { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #keo-call .hold { object-fit: contain; image-rendering: pixelated; padding: 20%; box-sizing: border-box; }
  #keo-call .self { position: absolute; right: 6px; bottom: 6px; width: 30%; border-radius: 6px; border: 2px solid rgba(255,255,255,.6); background: #000; }
  #keo-call [hidden] { display: none; }
  #keo-call .note { margin-top: 8px; font-size: 12px; color: #f1c27d; }
  #keo-call .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #keo-call button { font: inherit; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; background: #343847; color: inherit; }
  #keo-call button:hover { background: #444a5e; }
  #keo-call button.go-video, #keo-call button.accept { background: #2f9e5b; }
  #keo-call button.hang, #keo-call button.decline { background: #c0392b; }
  /* The confirmation dialog (keo-confirm.js): drawn and placed by this page only. Like the call panel it stays BELOW the vault. */
  #keo-confirm { position: fixed; inset: 0; z-index: 2147483001; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  #keo-confirm[hidden] { display: none; }
  #keo-confirm .box { width: 340px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 16px; background: #1d1f27; color: #f2f3f7;
                      border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
  #keo-confirm .title { font-weight: 600; font-size: 15px; margin-bottom: 12px; }
  #keo-confirm .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #keo-confirm .head[hidden] { display: none; }
  #keo-confirm .who-img { width: 40px; height: 40px; border-radius: 6px; image-rendering: pixelated; flex: none; }
  #keo-confirm .who { min-width: 0; }
  #keo-confirm .who-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #keo-confirm .who-did { font: 12px ui-monospace, monospace; color: #a9adbd; }
  #keo-confirm .text { color: #d6d9e4; line-height: 1.4; }
  #keo-confirm .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #keo-confirm button { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; background: #343847; color: inherit; }
  #keo-confirm button:hover { background: #444a5e; }
  #keo-confirm button.yes { background: #c0392b; }
  /* The friend dialog (keo-friend.js): drawn and placed by this page only. Like the others it stays BELOW the vault's unlock frame. */
  #keo-friend { position: fixed; inset: 0; z-index: 2147483002; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  #keo-friend[hidden] { display: none; }
  #keo-friend .box { width: 380px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 16px; background: #1d1f27; color: #f2f3f7;
                     border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
  #keo-friend .title { font-weight: 600; font-size: 15px; margin-bottom: 12px; }
  #keo-friend .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #keo-friend .who-img { width: 40px; height: 40px; border-radius: 6px; image-rendering: pixelated; flex: none; }
  #keo-friend .who { min-width: 0; }
  #keo-friend .who-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #keo-friend .who-did { font: 12px ui-monospace, monospace; color: #a9adbd; }
  #keo-friend .text { color: #d6d9e4; line-height: 1.4; margin-bottom: 12px; }
  #keo-friend .label { display: block; font-size: 12px; color: #a9adbd; margin: 10px 0 4px; }
  #keo-friend .words { font: 15px ui-monospace, monospace; padding: 8px 10px; background: #2a2d3a; border-radius: 8px; line-height: 1.5; word-spacing: 4px; user-select: all; }
  #keo-friend input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: 15px ui-monospace, monospace; padding: 8px 10px; border: 1px solid #444a5e; border-radius: 8px; background: #14161c; color: inherit; }
  #keo-friend .hint { min-height: 18px; margin-top: 6px; font-size: 12px; color: #a9adbd; }
  #keo-friend .hint.good { color: #6fd39a; }
  #keo-friend .hint.bad { color: #f1948a; }
  #keo-friend .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  #keo-friend button { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; background: #343847; color: inherit; }
  #keo-friend button:hover { background: #444a5e; }
  #keo-friend button.yes { background: #2f9e5b; }
  #keo-friend button:disabled { opacity: .4; cursor: default; }
</style>
<!-- Both frames get their src from shell.js, after its message listener exists (the world's only once keo-gate.js has decided how it starts). -->
<iframe id="world"></iframe>
<iframe id="vault" title="Identity vault" allow="publickey-credentials-get; publickey-credentials-create" tabindex="-1" aria-hidden="true"></iframe>
