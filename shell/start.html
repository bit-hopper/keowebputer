<!doctype html>
<meta charset="utf-8">
<title>keo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui, sans-serif; color: #222; }
  #bar { height: 32px; box-sizing: border-box; display: flex; align-items: center; gap: .75rem; padding: 0 .75rem; background: #f4f4f4; border-bottom: 1px solid #ddd; }
  #bar b { font-weight: 600; }
  #bar button { font: inherit; padding: .1rem .6rem; cursor: pointer; }
  #world { display: block; border: 0; width: 100%; height: calc(100% - 32px); }
  /* The identity vault page: hidden (1px, transparent, not clickable) until the world asks for its unlock button. */
  #vault { position: fixed; left: 0; top: 0; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
  #vault.shown { left: 50%; top: 50%; width: 320px; height: 96px; transform: translate(-50%, -50%); opacity: 1; pointer-events: auto;
                 z-index: 2147483647; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
  #acct { display: none; position: absolute; top: 33px; right: 0; width: min(46rem, 100%); max-height: calc(100% - 33px); overflow: auto;
          box-sizing: border-box; padding: .75rem 1rem; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 14px rgba(0,0,0,.2); z-index: 10; }
  #acct.open { display: block; }
  #acct button { font: inherit; padding: .5rem 1rem; margin: 0 .5rem .5rem 0; cursor: pointer; }
  #log { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; word-break: break-all; min-height: 4rem; }
  code { background: #eee; padding: 0 .25rem; }
</style>
<div id="bar">
  <b>keo</b>
  <span id="status"></span>
  <span style="flex:1"></span>
  <button id="toggle">Account</button>
</div>
<div id="acct">
  <p>Prototype: creates a local account in this browser from an unpacked extension. Nothing leaves your device.</p>
  <p>Origin / rpId (the extension id): <code id="extid"></code></p>
  <p>
    <button id="create">Create local account</button>
    <button id="signin">Sign in again</button>
    <button id="export">Export identity file</button>
    <button id="reset">Clear local data</button>
  </p>
  <div id="log"></div>
</div>
<!-- Both frames get their src from shell.js, after its message listener exists. -->
<iframe id="world"></iframe>
<iframe id="vault" title="Identity vault" allow="publickey-credentials-get; publickey-credentials-create" tabindex="-1" aria-hidden="true"></iframe>
<script src="shell-store.js"></script>
<script src="keo-did.js"></script>
<script src="keo-identity.js"></script>
<script src="shell.js"></script>
<script src="start.js"></script>
